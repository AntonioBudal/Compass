services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: compass-postgres
    environment:
      POSTGRES_USER: compass_dev
      POSTGRES_PASSWORD: compass_password
      POSTGRES_DB: compass_db
    ports:
      - "5433:5432"
    volumes:
      - compass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass_dev -d compass_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  compass_pgdata:
